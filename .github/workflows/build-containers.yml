name: Build and Test Containers

# Este workflow valida que los contenedores se construyen correctamente
# Usa Docker (disponible en GitHub Actions) para builds, pero los comandos
# son compatibles con Podman

on:
  pull_request:
    branches: [ main, development ]
    paths:
      - 'backend/**'
      - 'rag_service/**'
      - 'docker-compose.yml'
      - '**/Dockerfile'
  push:
    branches: [ main, development ]
    paths:
      - 'backend/**'
      - 'rag_service/**'
      - 'docker-compose.yml'
      - '**/Dockerfile'

jobs:
  build-backend:
    name: Build Backend Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: tfg-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_DEV=true

      - name: Test backend image can run
        run: |
          # Start container in detached mode
          CONTAINER_ID=$(docker run --rm -d \
            -e GEMINI_API_KEY=test \
            -e LLM_PROVIDER=gemini \
            tfg-backend:test)
          
          echo "Container started with ID: $CONTAINER_ID"
          
          # Wait a bit for startup
          sleep 5
          
          # Check if container is still running
          if docker ps -q --filter "id=$CONTAINER_ID" | grep -q .; then
            echo "✅ Container is running"
            docker logs "$CONTAINER_ID"
            docker stop "$CONTAINER_ID"
          else
            echo "⚠️ Container exited (checking if it's due to missing services)"
            echo "Checking logs for errors..."
            docker logs "$CONTAINER_ID" || true
            
            # Verify the container at least started (exit code should be from missing deps, not build errors)
            if docker logs "$CONTAINER_ID" 2>&1 | grep -q "uvicorn"; then
              echo "✅ Container started successfully (uvicorn attempted to run)"
              exit 0
            else
              echo "❌ Container failed to start properly"
              exit 1
            fi
          fi

  build-rag-service:
    name: Build RAG Service Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rag_service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rag_service/Dockerfile
          push: false
          load: true
          tags: rag-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_DEV=true

      - name: Test rag_service image can run
        run: |
          # Start container in detached mode
          CONTAINER_ID=$(docker run --rm -d \
            -e QDRANT_HOST=localhost \
            -e OLLAMA_HOST=localhost \
            rag-service:test)
          
          echo "Container started with ID: $CONTAINER_ID"
          
          # Wait a bit for startup
          sleep 5
          
          # Check if container is still running (it may crash on startup if no Qdrant)
          if docker ps -q --filter "id=$CONTAINER_ID" | grep -q .; then
            echo "✅ Container is running"
            docker logs "$CONTAINER_ID"
            docker stop "$CONTAINER_ID"
          else
            echo "⚠️ Container exited (expected - no Qdrant service available)"
            echo "Checking logs for errors..."
            docker logs "$CONTAINER_ID" || true
            
            # Verify the container at least started (exit code should be from missing deps, not build errors)
            # We consider it a success if the container ran and exited with connection errors
            if docker logs "$CONTAINER_ID" 2>&1 | grep -q "uvicorn"; then
              echo "✅ Container started successfully (uvicorn attempted to run)"
              exit 0
            else
              echo "❌ Container failed to start properly"
              exit 1
            fi
          fi

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-rag-service]
    if: always()
    steps:
      - name: Check build results
        run: |
          if [[ "${{ needs.build-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.build-rag-service.result }}" == "failure" ]]; then
            echo "❌ Some container builds failed"
            exit 1
          else
            echo "✅ All containers built successfully"
          fi
