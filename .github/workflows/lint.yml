name: Code Quality

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main, development ]

jobs:
  lint-python:
    name: Python Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install code quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Ruff check
        run: |
          echo "Running ruff linter..."
          ruff check . --output-format=github
        continue-on-error: false

      - name: Black check
        run: |
          echo "Checking code formatting with black..."
          black --check --diff .
        continue-on-error: false

      - name: isort check
        run: |
          echo "Checking import sorting with isort..."
          isort --check --diff .
        continue-on-error: false

      - name: Type check with mypy (backend)
        run: |
          echo "Running mypy type checker on backend..."
          mypy backend/ || echo "⚠️ Type errors found in backend (not failing build)"
        continue-on-error: true

      - name: Type check with mypy (rag_service)
        run: |
          echo "Running mypy type checker on rag_service..."
          mypy rag_service/ || echo "⚠️ Type errors found in rag_service (not failing build)"
        continue-on-error: true

  lint-frontend:
    name: Frontend Lint and Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome lint (errors only)
        run: |
          echo "Running Biome linter..."
          npx @biomejs/biome lint .
        continue-on-error: false

      - name: Biome format check
        run: |
          echo "Checking Biome formatting..."
          npx @biomejs/biome format . --write
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚠️ Some files were reformatted. Run 'npm run format' locally and commit the changes."
            git diff --name-only
            exit 1
          fi
        continue-on-error: false

      - name: TypeScript check
        run: |
          echo "Running TypeScript compiler..."
          npx tsc --noEmit
        continue-on-error: false

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend]
    if: always()
    steps:
      - name: Check lint results
        run: |
          if [[ "${{ needs.lint-python.result }}" == "failure" ]] || [[ "${{ needs.lint-frontend.result }}" == "failure" ]]; then
            echo "❌ Code quality checks failed"
            echo "Python: Run 'ruff check . && black . && isort .'"
            echo "Frontend: Run 'cd frontend && npx biome check . && npx tsc --noEmit'"
            exit 1
          else
            echo "✅ All code quality checks passed"
          fi
