# Jekyll configuration
title: TFG chatbot
description: Proyecto de Trabajo de Fin de Grado sobre un chatbot educativo con IA
baseurl: "/TFG-Chatbot"
url: "https://GabrielFranciscoSM.github.io"

# Theme - Just the Docs
remote_theme: just-the-docs/just-the-docs

# Color scheme
color_scheme: light

# Footer content
footer_content: "Copyright &copy; 2025 Gabriel Francisco Sánchez Muñoz. Distribuido bajo licencia MIT."

# Back to top link
back_to_top: true
back_to_top_text: "Volver arriba"

# GitHub integration
gh_edit_link: true
gh_edit_link_text: "Editar en GitHub"
gh_edit_repository: "https://github.com/GabrielFranciscoSM/TFG-Chatbot"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive

# Mermaid diagrams support
mermaid:
  # Version of mermaid library
  # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
  version: "11"

# Default front matter for files without explicit front matter
defaults:
  # Exclude other service subdirectory files (non-README) from navigation
  - scope:
      path: "docs/services/backend"
    values:
      nav_exclude: true
  - scope:
      path: "docs/services/chatbot"
    values:
      nav_exclude: true
  - scope:
      path: "docs/services/frontend"
    values:
      nav_exclude: true
  - scope:
      path: "docs/services/rag_service"
    values:
      nav_exclude: true
  - scope:
      path: "docs/services/math_service"
    values:
      nav_exclude: true
  - scope:
      path: "docs/services/infrastructure"
    values:
      nav_exclude: true

# Exclude files from processing
exclude:
  - backend/
  - scripts/
  - tests/
  - models/
  - local/
  - rag_service/
  - devLog/notas/
  - docker-compose.yml
  - Dockerfile
  - pyproject.toml
  - pytest.ini
  - "*.pyc"
  - __pycache__/
  - docs/ADR/adr-template.md
  - docs/devlog/adr/adr-template.md
  - docs/notas/
