global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'console'

receivers:
  - name: 'console'
    # Logs alerts to stdout (visible in docker logs alertmanager)
    # To add Slack/email, configure webhook_configs or email_configs here

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
