[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-chatbot-auth-service"
version = "0.1.0"
description = "Authentication Service for TFG Chatbot"
authors = [ { name = "Gabriel Francisco" } ]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "bcrypt==4.0.1",
  "python-multipart",
  "pymongo",
  "python-dotenv",
  "pydantic[email]"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-asyncio>=0.21.0",
  "httpx"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
