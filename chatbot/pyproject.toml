[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-chatbot-chatbot"
version = "1.0.0"
description = "Chatbot Service for TFG Chatbot (FastAPI)"
authors = [ { name = "Gabriel Francisco" } ]
dependencies = [
  "langchain",
  "langchain-openai",
  "langchain-google-genai",
  "langchain-mistralai",
  "langchain-community",
  "langchain-core",
  "langgraph",
  "pydantic-settings",
  "pymongo",
  "duckduckgo-search",
  "ddgs",
  "langgraph-checkpoint-sqlite",
  "fastapi",
  "uvicorn[standard]",
  "beautifulsoup4>=4.12.2",
  # Observability - Phoenix + OpenInference
  "arize-phoenix>=4.0.0",
  "openinference-instrumentation-langchain>=0.1.0",
  "openinference-semantic-conventions>=0.1.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp>=1.20.0",
  "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
