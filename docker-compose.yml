
services:
  vllm-openai:
    image: docker.io/vllm/vllm-openai:latest
    container_name: vllm-service
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities:
                - gpu
    volumes:
        - "./models:/models"
        - "vllm_cache:/root/.cache/vllm"
    env_file:
      - .env
    environment:
        HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
        TORCH_CUDA_ARCH_LIST: "8.9"
    ports:
        - 8001:8000  # External port 8001 to avoid conflict with backend
    command: >
      --model ${MODEL_PATH}
      --max-num-seqs 4
      --max-model-len 2048
      --gpu-memory-utilization 0.6
      --port ${VLLM_MAIN_PORT}
      --tool-call-parser hermes
      --enable-auto-tool-choice
      --swap-space 3
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    container_name: tfg-chatbot
    env_file:
      - .env
    environment:
      VLLM_HOST: vllm-openai
      PHOENIX_HOST: phoenix
      PHOENIX_PORT: "6006"
      PHOENIX_PROJECT_NAME: tfg-chatbot
    ports:
      - "8080:8080"
    depends_on:
      # - vllm-openai
      - rag_service
      - phoenix
    restart: unless-stopped

  mongo:
    image: docker.io/mongo:8.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand(\"ping\").ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: docker.io/mongo-express:1.0.0
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      # Use admin credentials configured on the mongo service
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOSTNAME:-mongo}
      ME_CONFIG_MONGODB_PORT: ${MONGO_PORT:-27017}
      ME_CONFIG_MONGODB_AUTH_DATABASE: ${MONGO_AUTH_DB:-admin}
      # Optional: enable basic auth to protect the UI
      ME_CONFIG_BASICAUTH_ENABLED: "${MONGO_EXPRESS_BASICAUTH_ENABLED:-true}"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASICAUTH_PASSWORD}
      # UI base path if needed
      ME_CONFIG_SITE_BASEURL: ${MONGO_EXPRESS_BASEURL:-/}
    depends_on:
      - mongo

  # Qdrant Vector Database
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: qdrant-service
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Ollama for Embeddings
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # RAG Service
  rag_service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    container_name: rag-service
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      OLLAMA_HOST: ollama
    ports:
      - "8081:8081"
    volumes:
      - rag_documents:/app/documents
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

  # Math Service
  math_service:
    build:
      context: .
      dockerfile: math_service/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    container_name: math-service
    env_file:
      - .env
    environment:
      MONGO_HOSTNAME: mongo
      OLLAMA_HOST: ollama
      RAG_SERVICE_URL: http://rag_service:8081
    ports:
      - "8083:8083"
    depends_on:
      - mongo
      - ollama
      - rag_service
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    container_name: tfg-gateway
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - chatbot
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: tfg-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Phoenix - LLM Observability (Arize AI)
  phoenix:
    image: docker.io/arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"  # Web UI
      - "4317:4317"  # OTLP gRPC
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alertmanager/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: docker.io/grafana/promtail:latest
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9094:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  mongodb_data:
  qdrant_storage:
  ollama_models:
  rag_documents:
  vllm_cache:
  phoenix_data:
  prometheus_data:
  loki_data:
  grafana_data: