
services:
  vllm-openai:
    container_name: tfg-vllm-openai
    image: vllm/vllm-openai:v0.17.1
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities:
                - gpu
    volumes:
        - "./models:/models"
        - "vllm_cache:/root/.cache/vllm"
    env_file:
      - .env
    environment:
        HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
        TORCH_CUDA_ARCH_LIST: "8.9"
    command: >
      --model ${MODEL_PATH}
      --max-num-seqs 4
      --max-model-len 2048
      --gpu-memory-utilization 0.6
      --port ${VLLM_MAIN_PORT}
      --tool-call-parser hermes
      --enable-auto-tool-choice
      --swap-space 3
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${VLLM_MAIN_PORT:-8000}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  chatbot:
    container_name: tfg-chatbot
    build:
      context: .
      dockerfile: chatbot/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    env_file:
      - .env
    environment:
      VLLM_HOST: vllm-openai
      PHOENIX_HOST: phoenix
      PHOENIX_PORT: "6006"
      PHOENIX_PROJECT_NAME: tfg-chatbot
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      rag_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mongo:
    container_name: tfg-mongo
    image: mongo:8.2.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    expose:
      - "27017"
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo-express:
    container_name: tfg-mongo-express
    image: mongo-express:1.0.2
    profiles: ["devtools"]
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      # Use admin credentials configured on the mongo service
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOSTNAME:-mongo}
      ME_CONFIG_MONGODB_PORT: ${MONGO_PORT:-27017}
      ME_CONFIG_MONGODB_AUTH_DATABASE: ${MONGO_AUTH_DB:-admin}
      # Optional: enable basic auth to protect the UI
      ME_CONFIG_BASICAUTH_ENABLED: "${MONGO_EXPRESS_BASICAUTH_ENABLED:-true}"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASICAUTH_PASSWORD}
      # UI base path if needed
      ME_CONFIG_SITE_BASEURL: ${MONGO_EXPRESS_BASEURL:-/}
    depends_on:
      mongo:
        condition: service_healthy

  # Qdrant Vector Database
  qdrant:
    container_name: tfg-qdrant
    image: qdrant/qdrant:v1.17.0
    expose:
      - "6333"
      - "6334"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Ollama for Embeddings
  ollama:
    container_name: tfg-ollama
    image: ollama/ollama:0.18.0
    expose:
      - "11434"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # RAG Service
  rag_service:
    container_name: tfg-rag-service
    build:
      context: .
      dockerfile: rag_service/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      OLLAMA_HOST: ollama
    expose:
      - "8081"
    ports:
      - "8081:8081"
    volumes:
      - rag_documents:/app/documents
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Math Service
  math_service:
    container_name: tfg-math-service
    build:
      context: .
      dockerfile: math_service/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    env_file:
      - .env
    environment:
      MONGO_HOSTNAME: mongo
      OLLAMA_HOST: ollama
      RAG_SERVICE_URL: http://rag_service:8081
    expose:
      - "8083"
    ports:
      - "8083:8083"
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_healthy
      rag_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  backend:
    container_name: tfg-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    env_file:
      - .env
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      chatbot:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    container_name: tfg-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Phoenix - LLM Observability (Arize AI)
  phoenix:
    container_name: tfg-phoenix
    image: arizephoenix/phoenix:13.15.0
    profiles: ["observability"]
    expose:
      - "6006"
      - "4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data
    restart: unless-stopped

  prometheus:
    container_name: tfg-prometheus
    image: prom/prometheus:v3.10.0
    profiles: ["observability"]
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alertmanager/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  loki:
    container_name: tfg-loki
    image: grafana/loki:3.6.7
    profiles: ["observability"]
    expose:
      - "3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    container_name: tfg-promtail
    image: grafana/promtail:3.6.7
    profiles: ["observability"]
    expose:
      - "9080"
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

  alertmanager:
    container_name: tfg-alertmanager
    image: prom/alertmanager:v0.31.1
    profiles: ["observability"]
    expose:
      - "9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  grafana:
    container_name: tfg-grafana
    image: grafana/grafana:12.4.1
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  mongodb_data:
  qdrant_storage:
  ollama_models:
  rag_documents:
  vllm_cache:
  phoenix_data:
  prometheus_data:
  loki_data:
  grafana_data: